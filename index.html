<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Santuario Digital</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- A-Frame 1.5.0 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Asegúrate de incluir este script ANTES de usar <a-entity spe-particles> -->
    <script
        src="https://cdn.jsdelivr.net/gh/c-frame/aframe-particle-system-component@1.1.4/dist/aframe-particle-system-component.min.js"></script>
<script
    src="https://unpkg.com/aframe-sprite-particles-component@0.5.4/dist/aframe-sprite-particles-component.js"></script>

    <!-- Componente para texto 3D con volumen -->
    <script
        src="https://unpkg.com/aframe-text-geometry-component@0.5.2/dist/aframe-text-geometry-component.min.js"></script>

    <!-- Troika Text para A-Frame -->
    <script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>

    <!-- Componentes custom -->
    <script type="module" src="./js/Main.js"></script>
    <script src="./js/systems/InteractionSystem.js"></script>
    <script src="./js/systems/DoorSystem.js"></script>
    <script src="./js/systems/creator-mode.js"></script>
    <script src="./js/controls/desktopControl.js"></script>
    <script src="./js/controls/mobileControl.js"></script>
    <script src="./js/controls/vr-controls.js"></script>
    <script src="./js/controls/fly-mode.js"></script>
    <script src="./js/components/activate-ar.js"></script>
    <script src="./js/components/revelation-mode.js"></script>
    <script src="./js/components/changenote.js"></script>
    <script src="./js/components/uploadimg.js"></script>
    <script src="./js/components/check-player.js"></script>
    <script src="./js/components/mirrormaterial.js"></script>
    <script src="./js/components/click-hover-handle.js"></script>
    <script src="./js/components/Embellecedor.js"></script>

    <script src="./js/debug-overlay.js"></script>

    <script>
        AFRAME.registerComponent("vr-scale-rig", {
            schema: {
                vrScale: { type: "number", default: 0.25 }, // factor de escala VR
                playerHeight: { type: "number", default: 1.6 } // altura real jugador
            },

            init: function () {
                const rig = this.el; // ← ESTA ES LA CLAVE, ya se llama en el rig directamente
                if (!rig) return;

                this.el.sceneEl.addEventListener("enter-vr", () => {
                    // Aplicar la escala al rig SOLO en VR
                    rig.setAttribute("scale", `${this.data.vrScale} ${this.data.vrScale} ${this.data.vrScale}`);

                    const alturaEscalada = this.data.playerHeight * this.data.vrScale;
                    console.log("🧍 Altura jugador original:", this.data.playerHeight, "m");
                    console.log("🧍 Altura jugador escalada:", alturaEscalada.toFixed(3), "m");
                    console.log("📏 Escala aplicada al rig:", this.data.vrScale);
                });

                // Opcional: restaurar escala al salir de VR
                this.el.sceneEl.addEventListener("exit-vr", () => {
                    rig.setAttribute("scale", "1 1 1");
                });
            }
        });
    </script>



</head>

<body>
    <!-- $$$$$$$$$$$$$ -->
    <!-- DEBUG OVERLAY -->
    <!-- $$$$$$$$$$$$$ -->
    <div id="debug-toggle" style="
            position:fixed;
            top:10px;
            right:10px;
            z-index:999999;
            background:#111;
            color:#0f0;
            padding:8px 12px;
            border-radius:6px;
            font-size:14px;
            cursor:pointer;
            opacity:0.8;">
        Debug
    </div>

    <div id="debug-console" style="
            display:none;
            position:fixed;
            top:0;
            right:0;
            width:50%;
            height:100%;
            overflow-y:auto;
            background:#000;
            font-family:monospace;
            font-size:12px;
            padding:12px;
            z-index:999998;
            opacity:0.85;
            border-left:2px solid #0f0;">

        <!-- Área de logs -->
        <div id="debug-log"></div>

        <!-- Línea de comandos -->
        <input id="debug-input" type="text" placeholder="Escribe un comando JS y pulsa Enter" style="
                width:100%;
                margin-top:10px;
                background:#111;
                color:#0f0;
                border:1px solid #0f0;
                padding:6px;
                font-family:monospace;
                font-size:12px;">
    </div>



    <!-- $$$$$$$$$$$$$ -->
    <!--  EL PROYECTO  -->
    <!-- $$$$$$$$$$$$$ -->
    <a-scene webxr="optionalFeatures: local-floor, bounded-floor, hand-tracking, layers" vr-mode-ui="enabled: true"
        cursor="rayOrigin: mouse" changenote pointer-draw plane-selector line-selector line-gizmo pointer-eraser upload-wall-texture fly-mode activate-ar="sky: #Main-sky;" revelation-mode vr-controls>
        <!-- Fondo -->
        <a-sky id="Main-sky" src="./assets/environment.png" rotation="0 145 0"></a-sky>

        <!-- Luz principal -->
        <a-entity light="type: directional; intensity: 1" position="1 2 1"></a-entity>
        <a-entity light="type: ambient; intensity: 0.3"></a-entity>
       
        <!-- RIG que agrupa movimiento + cámara -->
        <a-entity id="rig" vr-scale-rig position="0 0 0" check-player touch-hold
            scroll-fly-smooth="speed:0.02; step:0.25; minY:-10; maxY:10">

            <!-- Cámara con todos tus controles -->
            <a-entity id="camera" camera look-controls arrow-fly-smooth="step:0.005; speed:0.15" swipe-up-down
                swipe-left-right position="0 0.25 0">
            </a-entity>

            <!-- CONTROLADOR IZQUIERDO -->
            <a-entity id="controller-left" role="vr-controller" laser-controls="hand: left"
                hand-tracking-controls="hand: left" raycaster="objects: .interactable; far: 20">
                <a-entity class="controller-cursor" cursor="fuse: false; rayOrigin: controller"
                    geometry="primitive: ring; radiusInner: 0.003; radiusOuter: 0.006"
                    material="color: white; shader: flat; opacity: 0.8" visible="false">
                </a-entity>
            </a-entity>

            <!-- CONTROLADOR DERECHO -->
            <a-entity id="controller-right" role="vr-controller" laser-controls="hand: right"
                hand-tracking-controls="hand: right" raycaster="objects: .interactable; far: 20">
                <a-entity class="controller-cursor" cursor="fuse: false; rayOrigin: controller"
                    geometry="primitive: ring; radiusInner: 0.003; radiusOuter: 0.006"
                    material="color: white; shader: flat; opacity: 0.8" visible="false">
                </a-entity>
            </a-entity>


        </a-entity>


        <!-- GLB cargado como escenario estático -->
        <a-entity id="escenario" gltf-model="./assets/escenario.glb" mirror-material="target: #escenario"
            click-hover-detector="maxDistance: 5" check-door>
        </a-entity>

        <a-entity color-picker>
            <a-circle color-wheel radius="0.1" position="-0.0075 0.25 0" rotation="0 90 0"></a-circle>
        </a-entity>

        <!-- Indicador moviendo: Checkdoor-FlightMode / Wings -->
        <a-entity id="hud-wings" position="0.44 0.98 3.015">
            <a-entity id="hud-wings-text"
                text-geometry="value: OFF; font: url(./assets/fonts/Roboto_Regular.json); size: 0.088; height: 0.03; curveSegments: 12"
                material="color: white; side: double; transparent: true; opacity: 0.5" rotation="0 180 0"
                position="0 0 0.01"
                animation="property: position; to: 0 0.02 0.01; dur: 1500; dir: alternate; loop: true; easing: easeInOutSine">
            </a-entity>
        </a-entity>

        <!-- Indicador moviendo: Checkdoor / Stars -->
        <a-entity id="hud-stars" position="1.315 0.98 1.912">
            <a-entity id="hud-stars-text"
                text-geometry="value: OFF; font: url(./assets/fonts/Roboto_Regular.json); size: 0.088; height: 0.03; curveSegments: 12"
                material="color: yellow; side: double; transparent: true; opacity: 0.5" rotation="0 270 0"
                position="0 0 0.01"
                animation="property: position; to: 0 0.02 0.01; dur: 1500; dir: alternate; loop: true; easing: easeInOutSine">
            </a-entity>
        </a-entity>

        <!-- Indicador moviendo: Checkdoor-ActivateAR / Cube -->
        <a-entity id="hud-cube" position="-0.55 0.98 2.1">
            <a-entity id="hud-cube-text"
                text-geometry="value: OFF; font: url(./assets/fonts/Roboto_Regular.json); size: 0.088; height: 0.03; curveSegments: 12"
                material="color: pink; side: double; transparent: true; opacity: 0.5" rotation="0 90 0" position="0 0 0.01"
                animation="property: position; to: 0 0.02 0.01; dur: 1500; dir: alternate; loop: true; easing: easeInOutSine">
            </a-entity>
        </a-entity>


        <!-- HUD o UI principal, pegada al visor -->
        <a-entity id="hud" hud-overlay="camera: #camera" scale="1 1 1">
            <!-- Plano de depuración para ver el HUD padre -->
            <a-plane hud-autoscale width="0.15" height="0.1" color="transparent" opacity="0.2" position="0 0 0"
                material="shader: flat; side: double; fog: false; depthTest: false; toneMapped: false;">
            </a-plane>

            <!-- Indicador FlightMode que será botónes YES/NO -->
            <a-entity id="y-n" hud-autoscale hud-child-position-scale position="-0.06 -0.04 0">
                <a-plane src="./assets/Wings-HUD.svg" width="0.02" height="0.01" transparent="true"
                    material="shader: flat; side: double; fog: false; depthTest: false; toneMapped: false;">
                </a-plane>

                <a-text id="y-n-text" value="YES" color="white" align="center" width="0.09">
                </a-text>
            </a-entity>
            <!-- Aquí se podrán añadir otros indicadores del HUD -->
        </a-entity>

        <!-- Partículas multicolor flotando en la escena -->
        <a-entity particle-system="preset: snow; color: #FF0000, #FFFFFF; particleCount: 500" visible="false"></a-entity>
        
        <a-entity id="magic-particles" visible="false" position="0 0 0"
            particle-system="preset: snow; particleCount: 300; size: 2.5; velocityValue: 0 0.05 0; color: #FF0000,#00FF00,#0000FF;"></a-entity>
       
            <a-entity visible="false" sprite-particles="texture: url(./assets/blob.png); velocity: .1 1 .1; color: red,#FF0;"></a-entity>
    </a-scene>
</body>

</html>
